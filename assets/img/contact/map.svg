<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Stylised map of our Bangalore location">
  <title>Stylised map of our Bangalore location</title>
  <rect width="800" height="520" fill="#F5EFE2"/>

  <!-- city blocks -->
  <g fill="#EDE3D0" stroke="#DFD2B8" stroke-width="1.4">
    <rect x="40" y="40" width="150" height="110" rx="3"/>
    <rect x="220" y="40" width="120" height="90" rx="3"/>
    <rect x="370" y="40" width="180" height="120" rx="3"/>
    <rect x="580" y="40" width="180" height="95" rx="3"/>
    <rect x="40" y="180" width="120" height="130" rx="3"/>
    <rect x="190" y="160" width="150" height="105" rx="3"/>
    <rect x="580" y="165" width="180" height="120" rx="3"/>
    <rect x="40" y="345" width="170" height="130" rx="3"/>
    <rect x="245" y="345" width="130" height="130" rx="3"/>
    <rect x="410" y="345" width="160" height="130" rx="3"/>
    <rect x="605" y="345" width="155" height="130" rx="3"/>
  </g>

  <!-- park -->
  <g>
    <rect x="380" y="190" width="165" height="120" rx="4" fill="#E2E7D2" stroke="#C8D2AE" stroke-width="1.4"/>
    <g fill="#B9C79A" opacity="0.85">
      <circle cx="410" cy="222" r="11"/><circle cx="443" cy="248" r="14"/>
      <circle cx="487" cy="216" r="10"/><circle cx="516" cy="262" r="12"/>
    </g>
  </g>

  <!-- roads -->
  <g stroke="#FBF7EC" stroke-width="17" stroke-linecap="round">
    <path d="M0 165h800M0 328h800M195 0v520M565 0v520"/>
  </g>
  <g stroke="#E4D7BC" stroke-width="1.4" stroke-dasharray="9 9">
    <path d="M0 165h800M0 328h800M195 0v520M565 0v520"/>
  </g>

  <!-- arterial ring road -->
  <path d="M60 60C220 20 520 10 720 70c60 60 70 300 10 400-180 50-470 50-650-10C20 350 10 130 60 60Z"
        fill="none" stroke="#D9C9A8" stroke-width="3" opacity="0.7"/>

  <!-- location pin -->
  <g transform="translate(378 246)">
    <ellipse cx="0" cy="16" rx="20" ry="6" fill="#8B0000" opacity="0.16"/>
    <path d="M0 12C0 12 26-14 26-32 26-46.4 14.4-58 0-58S-26-46.4-26-32C-26-14 0 12 0 12Z"
          fill="#8B0000" stroke="#FFF8F0" stroke-width="3"/>
    <circle cx="0" cy="-32" r="9" fill="#FFF8F0"/>
  </g>

  <g font-family="'Jost', 'Helvetica Neue', Arial, sans-serif" fill="#7A6A52">
    <text x="392" y="200" font-size="17" letter-spacing="3.2" fill="#8B0000">MG ROAD</text>
    <text x="40" y="158" font-size="13" letter-spacing="2.4">CUBBON PARK</text>
    <text x="596" y="336" font-size="13" letter-spacing="2.4">RESIDENCY RD</text>
  </g>
</svg>
